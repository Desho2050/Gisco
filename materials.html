<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GISCO – Received Materials Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --brand: #00bfa5; /* GISCO Teal */
      --brand-glow: rgba(0, 191, 165, 0.4);
      --accent: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.1);
      --success: #00ffaa;
      --warning: #000000;
      
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 191, 165, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism Utilities */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    /* Header */
    header {
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-area { display: flex; align-items: center; gap: 15px; }
    .logo-mark {
      min-width: 80px; height: 40px; padding: 0 10px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 16px; letter-spacing: 1px; color: white;
    }
    .titles h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
    .titles p { font-size: 0.85rem; color: var(--text-muted); }

    .actions-top { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text-main);
      cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #000; font-weight: 700; }
    .btn.primary:hover { background: #00e6c5; box-shadow: 0 0 15px var(--brand-glow); }

    /* Main Layout */
    main {
      flex: 1; padding: 30px; max-width: 1600px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* Dashboard Summary Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .stat-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--brand);
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .stat-sub { font-size: 0.9rem; color: var(--brand); margin-top: 5px; }

    /* Controls & Search */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }
    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
    .modern-input {
      background: rgb(255, 255, 255);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      color: rgb(0, 0, 0);
      font-family: 'Inter', sans-serif;
      min-width: 180px;
      flex: 1;
    }
    .modern-input:focus { outline: none; border-color: var(--brand); }
    .modern-input::placeholder { color: rgb(43, 43, 43); }

    /* Data Table */
    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
    }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th {
      text-align: left; padding: 16px;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      position: sticky; top: 0;
    }
    td {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-size: 0.9rem; vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.03); }
    
    .col-code { font-family: 'JetBrains Mono'; color: var(--accent); }
    .col-money { font-family: 'JetBrains Mono'; color: var(--success); }
    
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
      background: rgb(4, 185, 28); border: 1px solid rgba(255,255,255,0.1);
    }
    .status-received { background: rgb(16, 185, 129); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
    .status-pending { background: radial-gradient(at 0% 0%, rgb(0, 191, 25) 0px, transparent 100%); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }

    /* Loader */
    .loader-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.9);
      display: none; align-items: center; justify-content: center; z-index: 999;
      flex-direction: column; gap: 15px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid var(--border);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; align-items: flex-start; }
      .actions-top { width: 100%; justify-content: space-between; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Print Styles */
    @media print {
      body { background: white; color: black; }
      .glass { background: white; border: 1px solid #ccc; backdrop-filter: none; }
      .actions-top, .search-group, .btn { display: none !important; }
      .stat-card { border: 1px solid #eee; color: black; }
      .stat-value { color: black; }
      table { min-width: 100%; }
      th { background: #f0f0f0 !important; color: black !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      td { color: black !important; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="color: var(--brand); font-weight: 600;">Loading Materials...</div>
  </div>

  <header class="glass">
    <div class="brand-area">
      <div class="logo-mark">GISCO</div>
      <div class="titles">
        <h1>Received Materials</h1>
        <p>Inventory Intelligence Dashboard</p>
      </div>
    </div>
    <div class="actions-top">
      <input type="file" id="localFile" accept=".csv" style="display:none" />
      <button class="btn" onclick="document.getElementById('localFile').click()">📂 Load CSV</button>
      <button class="btn primary" onclick="window.print()">🖨️ Print Report</button>
      <a href="index.html" class="btn">⬅ Home</a>
    </div>
  </header>

  <main>
    <!-- Financial Dashboard -->
    <div class="dashboard-grid">
      <div class="glass stat-card">
        <span class="stat-label">Total Records</span>
        <span class="stat-value" id="resultCount">0</span>
        <span class="stat-sub">Items Found</span>
      </div>
      <div class="glass stat-card" style="border-color: var(--success);">
        <span class="stat-label">Total Value</span>
        <span class="stat-value" style="color: var(--success);" id="sumAmount">AED 0.00</span>
        <span class="stat-sub">Received Inventory</span>
      </div>
    </div>

    <!-- Search & Actions -->
    <div class="glass controls-bar" style="padding: 15px;">
      <div class="search-group">
        <input id="q1" class="modern-input" type="text" placeholder="Search Request..." onkeyup="filterNow()">
        <input id="q2" class="modern-input" type="text" placeholder="Oracle Code..." onkeyup="filterNow()">
        <input id="q3" class="modern-input" type="text" placeholder="Description..." onkeyup="filterNow()">
        <input id="q4" class="modern-input" type="text" placeholder="Job No / Order..." onkeyup="filterNow()">
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container glass">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Request</th>
            <th>Oracle Code</th>
            <th>Description</th>
            <th>Category</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Job No</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Order</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    // i18n setup
    const I18N = {
      en: {
        brand_title: 'Gulf Industrial Service Company',
        back_main: 'Back to Main Page',
        results_label: 'results',
        page_title_en: 'Received Materials',
        page_sub_en: 'Enhanced Search'
      },
      ar: {
        brand_title: 'شركة الخليج للخدمات الصناعية',
        back_main: 'العودة إلى الصفحة الرئيسية',
        results_label: 'نتائج',
        page_title_en: 'المواد المستلمة',
        page_sub_en: 'بحث محسّن'
      }
    };
    const getLang = () => localStorage.getItem('lang') || 'ar';
    const applyLang = (lang) => {
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      const dict = I18N[lang] || I18N.ar;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
    };
    const setLang = (lang) => { localStorage.setItem('lang', lang); applyLang(lang); };

    const excelPath = 'Materials.csv'; // Updated to CSV
    let ALL_DATA = [];

    const FIELD_ALIASES = {
      request: ['request','req','reqno','req_no','req id','reqid'],
      code: ['oracle code','code','item code','item_code','oracle_code','id','itemid'],
      description: ['item description','description','desc','item name','name'],
      category: ['item category','category','cat','type','class'],
      qty: ['qty','quantity','onhand','on hand','stock','balance'],
      price: ['price','unit price','unitprice','rate','cost'],
      job: ['job no','job','jobno','job number','job_number'],
      status: ['status','statue','state','approval'],
      order: ['order','po','po no','po_no','order no','order_no']
    };

    function normalizeKey(k){ return String(k || '').toLowerCase().replace(/\s+|_/g,'').trim(); }
    function pickField(obj, aliases){
      const keys = Object.keys(obj);
      const normToKey = new Map(keys.map(k => [normalizeKey(k), k]));
      for (const alias of aliases){
        const nk = normalizeKey(alias);
        if (normToKey.has(nk)) return obj[normToKey.get(nk)];
      }
      return '';
    }

    function buildRow(item){
      const request = String(pickField(item, FIELD_ALIASES.request) || '').trim();
      const code = String(pickField(item, FIELD_ALIASES.code) || '').trim();
      const description = String(pickField(item, FIELD_ALIASES.description) || '').trim();
      const category = String(pickField(item, FIELD_ALIASES.category) || '').trim();
      const qty = Number(pickField(item, FIELD_ALIASES.qty) || 0);
      const price = Number(pickField(item, FIELD_ALIASES.price) || 0);
      const job = String(pickField(item, FIELD_ALIASES.job) || '').trim();
      const status = String(pickField(item, FIELD_ALIASES.status) || '').trim();
      const order = String(pickField(item, FIELD_ALIASES.order) || '').trim();
      const total = qty * price;
      
      // Create a searchable string
      const searchIndex = `${request} ${code} ${description} ${category} ${job} ${order} ${status}`.toLowerCase();
      
      return { request, code, description, category, qty, price, job, total, status, order, searchIndex };
    }

    function escapeHtml(s){
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    function formatMoney(n){ return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function formatAED(n){ return new Intl.NumberFormat('en-AE', { style: 'currency', currency: 'AED' }).format(Number(n || 0)); }

    function renderTable(rows){
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";
      
      let totalVal = 0;

      rows.forEach(r => {
        totalVal += r.total;
        
        // Dynamic Status Badge
        let statusClass = 'status-pending';
        if(r.status.toLowerCase().includes('received') || r.status.toLowerCase().includes('complete')) {
          statusClass = 'status-received';
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.request)}</td>
          <td class="col-code">${escapeHtml(r.code)}</td>
          <td>${escapeHtml(r.description)}</td>
          <td>${escapeHtml(r.category)}</td>
          <td style="text-align:center">${r.qty}</td>
          <td style="text-align:right">${formatMoney(r.price)}</td>
          <td>${escapeHtml(r.job)}</td>
          <td class="col-money" style="text-align:right">${formatMoney(r.total)}</td>
          <td style="text-align:center"><span class="status-badge ${statusClass}">${escapeHtml(r.status)}</span></td>
          <td>${escapeHtml(r.order)}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("resultCount").textContent = rows.length.toLocaleString();
      document.getElementById("sumAmount").textContent = formatAED(totalVal);
    }

    function filterNow(){
      const q1 = document.getElementById("q1").value.toLowerCase();
      const q2 = document.getElementById("q2").value.toLowerCase();
      const q3 = document.getElementById("q3").value.toLowerCase();
      const q4 = document.getElementById("q4").value.toLowerCase();

      const filtered = ALL_DATA.filter(item => {
        return (!q1 || item.searchIndex.includes(q1)) &&
               (!q2 || item.searchIndex.includes(q2)) &&
               (!q3 || item.searchIndex.includes(q3)) &&
               (!q4 || item.searchIndex.includes(q4));
      });
      renderTable(filtered);
    }

    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }

    // Updated to read CSV as text instead of arrayBuffer
    async function loadExcel(){
      try {
        showLoader(true);
        const res = await fetch(excelPath + '?ts=' + Date.now());
        if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
        const text = await res.text(); // Read as text for CSV
        const wb = XLSX.read(text, { type: 'string' }); // Parse as string
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        ALL_DATA = json.map(buildRow);
        renderTable(ALL_DATA);
      } catch (err) {
        console.error(err);
        // Fallback to local button if fetch fails
        document.querySelector('.btn[onclick*="localFile"]').style.display = 'inline-flex';
      } finally {
        showLoader(false);
      }
    }

    // Updated to read CSV as text instead of arrayBuffer
    async function loadLocalFile(file){
      if (!file) return;
      showLoader(true);
      try {
        const text = await file.text(); // Read as text for CSV
        const wb = XLSX.read(text, { type: 'string' }); // Parse as string
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        ALL_DATA = json.map(buildRow);
        renderTable(ALL_DATA);
      } catch (e) {
        alert('Error loading file.');
      } finally {
        showLoader(false);
      }
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      applyLang(getLang());
      document.querySelectorAll('[data-lang]').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
      
      document.getElementById('localFile').addEventListener('change', (e) => loadLocalFile(e.target.files[0]));
      
      if (location.protocol !== 'file:') {
        loadExcel();
      } else {
        document.querySelector('.btn[onclick*="localFile"]').style.display = 'inline-flex';
      }
    });
  </script>
</body>
</html>
