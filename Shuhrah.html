<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GISCO – Procurement Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --brand: #00bfa5; /* GISCO Teal */
      --brand-glow: rgba(0, 191, 165, 0.4);
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.1);
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 191, 165, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism Utilities */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    /* Header */
    header {
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-area { display: flex; align-items: center; gap: 15px; }
    .logo-mark {
      min-width: 80px; height: 40px; padding: 0 10px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 800; font-size: 16px; letter-spacing: 1px; color: white;
    }
    .titles h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
    .titles p { font-size: 0.85rem; color: var(--text-muted); }

    .actions-top { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: rgba(255,255,255,0.05); color: var(--text-main);
      cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
      text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #000; font-weight: 700; }
    .btn.primary:hover { background: #00e6c5; box-shadow: 0 0 15px var(--brand-glow); }

    /* Main Layout */
    main {
      flex: 1; padding: 30px; max-width: 1600px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* Dashboard Summary Cards */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .stat-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
      background: var(--brand);
    }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .stat-sub { font-size: 0.9rem; color: var(--brand); margin-top: 5px; }

    /* The Arabic Words Display */
    .words-card {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, rgba(0, 191, 165, 0.1), rgba(0, 0, 0, 0));
      border: 1px solid var(--brand);
      text-align: center;
      padding: 15px;
    }
    .words-text {
      font-size: 1.2rem;
      color: var(--brand);
      font-weight: 700;
      text-shadow: 0 0 10px var(--brand-glow);
    }

    /* Controls & Search */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }
    .search-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }
    .modern-input {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 8px;
      color: white;
      font-family: 'Inter', sans-serif;
      min-width: 180px;
      flex: 1;
    }
    .modern-input:focus { outline: none; border-color: var(--brand); }

    /* Data Table */
    .table-container {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
    }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th {
      text-align: left; padding: 16px;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      position: sticky; top: 0;
    }
    td {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-size: 0.9rem; vertical-align: middle;
    }
    tr:hover td { background: rgba(255,255,255,0.03); }
    
    .col-code { font-family: 'JetBrains Mono'; color: var(--accent); }
    .col-money { font-family: 'JetBrains Mono'; color: var(--success); }
    
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
    }

    /* Loader */
    .loader-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.9);
      display: none; align-items: center; justify-content: center; z-index: 999;
      flex-direction: column; gap: 15px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid var(--border);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; align-items: flex-start; }
      .actions-top { width: 100%; justify-content: space-between; }
      .dashboard-grid { grid-template-columns: 1fr; }
    }

    /* Print Styles */
    @media print {
      body { background: white; color: black; }
      .glass { background: white; border: 1px solid #ccc; backdrop-filter: none; }
      .actions-top, .search-group, .btn { display: none !important; }
      .stat-card { border: 1px solid #eee; color: black; }
      .stat-value { color: black; }
      .words-text { color: black; text-shadow: none; }
      table { min-width: 100%; }
      th { background: #f0f0f0 !important; color: black !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      td { color: black !important; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>

  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div style="color: var(--brand); font-weight: 600;">Processing Data...</div>
  </div>

  <header class="glass">
    <div class="brand-area">
      <div class="logo-mark">GISCO</div>
      <div class="titles">
        <h1>Procurement Summary</h1>
        <p>Gulf Industrial Services Co.</p>
      </div>
    </div>
    <div class="actions-top">
      <input type="file" id="localFile" accept=".xlsx,.xls" style="display:none" />
      <button class="btn" onclick="document.getElementById('localFile').click()">📂 Load Excel</button>
      <button class="btn primary" onclick="exportExcel()">💾 Save</button>
      <button class="btn" onclick="window.print()">🖨️ Print</button>
      <a href="index.html" class="btn">⬅ Home</a>
    </div>
  </header>

  <main>
    <!-- Financial Dashboard -->
    <div class="dashboard-grid">
      <div class="glass stat-card">
        <span class="stat-label">Total Quantity</span>
        <span class="stat-value" id="totalQty">0</span>
        <span class="stat-sub">Compressors / Units</span>
      </div>
      <div class="glass stat-card">
        <span class="stat-label">Net Cost (No VAT)</span>
        <span class="stat-value" id="totalWithoutVAT">0.00</span>
        <span class="stat-sub">AED</span>
      </div>
      <div class="glass stat-card" style="border-color: var(--success);">
        <span class="stat-label">Total with VAT (5%)</span>
        <span class="stat-value" style="color: var(--success);" id="totalWithVAT">0.00</span>
        <span class="stat-sub">AED</span>
      </div>
      
      <!-- Arabic Words Display -->
      <div class="glass words-card">
        <span class="stat-label">Total Amount in Words</span>
        <div class="words-text" id="totalWithVATWords">صفر درهماً</div>
      </div>
    </div>

    <!-- Search & Actions -->
    <div class="glass controls-bar" style="padding: 15px;">
      <div class="search-group">
        <input id="search1" class="modern-input" type="text" placeholder="Search Request..." onkeyup="filterTable()">
        <input id="search2" class="modern-input" type="text" placeholder="Item Code..." onkeyup="filterTable()">
        <input id="search3" class="modern-input" type="text" placeholder="Description..." onkeyup="filterTable()">
        <input id="search4" class="modern-input" type="text" placeholder="Job No..." onkeyup="filterTable()">
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-container glass">
      <table id="data-table">
        <thead>
          <tr>
            <th>Request</th>
            <th>Item Code</th>
            <th>Description</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Job No</th>
            <th>Total</th>
            <th>Status</th>
            <th>Order</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    let data = [];
    const vatRate = 1.05;

    // --- Helpers ---
    function showLoader(show) { document.getElementById('loader').style.display = show ? 'flex' : 'none'; }
    
    function formatCurrency(value) { 
      return Number(value || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
    }

    function normalizeValue(v) { return String(v ?? '').toLowerCase().trim(); }
    function buildSearchIndex(item) {
      return Object.values(item).map(v => normalizeValue(v)).join(' ');
    }

    // --- Arabic Number to Words Logic (Optimized) ---
    function numberToArabicWords(num) {
      if (num === 0) return 'صفر درهماً';
      if (num < 0) return 'سالب ' + numberToArabicWords(-num);
      
      const ones = ['',' واحد',' اثنان ','ثلاثة ','أربعة ','خمسة ','ستة','سبعة','ثمانية','تسعة','عشرة',
                    'أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
      const tens = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
      const hundreds = ['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
      
      function convertGroup(n) {
        let res = '';
        if (n >= 100) { res += hundreds[Math.floor(n / 100)] + ' و '; n %= 100; }
        if (n >= 20) { res += (ones[n % 10] ? ones[n % 10] + ' و ' : '') + tens[Math.floor(n / 10)]; }
        else if (n > 0) { res += ones[n]; }
        return res.replace(/\s+و\s*$/, ''); // Clean trailing 'and'
      }

      if (num >= 1000000000) return 'الرقم كبير جداً';
      
      let parts = [];
      let scaleIndex = 0;
      const scales = ['','ألف','مليون','مليار'];
      
      while (num > 0) {
        let group = num % 1000;
        if (group !== 0) {
          let groupText = convertGroup(group);
          if (scaleIndex > 0) {
            if (group === 1) groupText = scales[scaleIndex];
            else if (group === 2) groupText = (scaleIndex === 1) ? 'ألفان' : 'مليونان';
            else {
               if (scaleIndex === 1) groupText += (group > 2 && group < 11) ? ' آلاف' : ' ألف';
               else if (scaleIndex === 2) groupText += (group > 2 && group < 11) ? ' ملايين' : ' مليون';
               else groupText += ' ' + scales[scaleIndex];
            }
          }
          parts.unshift(groupText);
        }
        num = Math.floor(num / 1000);
        scaleIndex++;
      }
      return parts.join(' و ') + ' درهماً';
    }

    // --- Core Logic ---
    function renderTable(rowsToRender = data) {
      const tbody = document.querySelector("#data-table tbody");
      tbody.innerHTML = "";
      
      let totalQty = 0, totalAmount = 0;

      rowsToRender.forEach((item, index) => {
        const qty = Number(item['Qty']) || 0;
        const price = Number(item['Price']) || 0;
        const total = qty * price;
        
        totalQty += qty;
        totalAmount += total;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item['REQUEST'] || ''}</td>
          <td class="col-code">${item['Item Code'] || ''}</td>
          <td>${item['Description'] || ''}</td>
          <td style="text-align:center">${qty}</td>
          <td style="text-align:right">${formatCurrency(price)}</td>
          <td>${item['Job No'] || ''}</td>
          <td class="col-money" style="text-align:right">${formatCurrency(total)}</td>
          <td style="text-align:center"><span class="status-badge">${item['Status'] || '-'}</span></td>
          <td>${item['Order'] || ''}</td>
        `;
        tbody.appendChild(tr);
      });

      // Update Dashboard
      const finalTotal = totalAmount * vatRate;
      document.getElementById("totalQty").textContent = totalQty.toLocaleString();
      document.getElementById("totalWithoutVAT").textContent = formatCurrency(totalAmount);
      document.getElementById("totalWithVAT").textContent = formatCurrency(finalTotal);
      document.getElementById("totalWithVATWords").textContent = numberToArabicWords(Math.round(finalTotal));
    }

    function filterTable() {
      const s1 = normalizeValue(document.getElementById("search1").value);
      const s2 = normalizeValue(document.getElementById("search2").value);
      const s3 = normalizeValue(document.getElementById("search3").value);
      const s4 = normalizeValue(document.getElementById("search4").value);

      const filtered = data.filter(item => {
        const idx = item.searchIndex || buildSearchIndex(item);
        return (!s1 || idx.includes(s1)) &&
               (!s2 || idx.includes(s2)) &&
               (!s3 || idx.includes(s3)) &&
               (!s4 || idx.includes(s4));
      });
      renderTable(filtered);
    }

    // --- File Handling ---
    async function loadLocalFile(file){
      if (!file) return;
      showLoader(true);
      try {
        const buf = await file.arrayBuffer();
        const workbook = XLSX.read(buf, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        data = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        data.forEach(item => item.searchIndex = buildSearchIndex(item));
        renderTable();
      } catch (e) {
        alert('Error loading file. Ensure it is a valid Excel file.');
        console.error(e);
      } finally {
        showLoader(false);
      }
    }

    function exportExcel() {
      const ws = XLSX.utils.json_to_sheet(data.map(({searchIndex,...r})=>r));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "GISCO_Summary");
      XLSX.writeFile(wb, 'GISCO_Purchase_Summary.xlsx');
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'pt', 'a4'); // Landscape
      
      doc.setFontSize(18);
      doc.text("GISCO Purchase Summary", 40, 40);
      doc.setFontSize(11);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 40, 60);

      const headers = [['Request','Code','Description','Qty','Price','Job No','Total','Status','Order']];
      const rows = data.map(i => [
        i['REQUEST'], i['Item Code'], i['Description'], i['Qty'], 
        i['Price'], i['Job No'], ((i['Qty']*i['Price'])).toFixed(2), i['Status'], i['Order']
      ]);

      doc.autoTable({
        head: headers,
        body: rows,
        startY: 80,
        theme: 'grid',
        styles: { fontSize: 9, cellPadding: 3 },
        headStyles: { fillColor: [0, 191, 165] }
      });

      doc.save('GISCO_Summary.pdf');
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('localFile').addEventListener('change', (e) => loadLocalFile(e.target.files[0]));
      
      // Auto-load if server is present
      if (location.protocol !== 'file:') {
        showLoader(true);
        fetch('sh.xlsx?ts=' + Date.now())
          .then(res => res.arrayBuffer())
          .then(buf => {
            const wb = XLSX.read(buf, { type: 'array' });
            data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            data.forEach(item => item.searchIndex = buildSearchIndex(item));
            renderTable();
          })
          .catch(err => console.log('Auto-load failed, waiting for manual load.'))
          .finally(() => showLoader(false));
      }
    });
  </script>
</body>
</html>
