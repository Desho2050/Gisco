<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oracle Materials – Intelligence Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --brand: #3b82f6;
      --accent: #8b5cf6;
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.1);
      --glow: 0 0 20px rgba(59, 130, 246, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Glassmorphism Utilities */
    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    /* Header */
    header {
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-area { display: flex; align-items: center; gap: 15px; }
        .logo-mark {
      /* Changed from 40px to auto width and added padding */
      min-width: 80px; 
      height: 40px;
      padding: 0 10px;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 800; 
      font-size: 16px; /* Slightly smaller font to fit 5 letters */
      letter-spacing: 1px; /* Adds space between letters for a premium look */
      color: white;
    }
    .titles h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
    .titles p { font-size: 0.85rem; color: var(--text-muted); }

    .actions-top { display: flex; gap: 10px; }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: white; }
    .btn.primary:hover { background: #2563eb; }

    /* Main Layout */
    main {
      flex: 1;
      padding: 30px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 30px;
    }

    /* Sidebar Controls */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    
    .search-panel { padding: 20px; }
    .input-group { margin-bottom: 12px; }
    .input-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .modern-input {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      color: white;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
    }
    .modern-input:focus { outline: none; border-color: var(--brand); }
    .modern-input::placeholder { color: rgba(223, 220, 220, 0.863); }
.modern-input:hover { background: rgba(5, 94, 177, 0.596); }
    .toggle-container {
      display: flex; align-items: center; gap: 10px;
      background: rgba(16, 185, 129, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.2);
      cursor: pointer;
      margin-top: 15px;
    }
    .toggle-container input { accent-color: var(--success); transform: scale(1.2); }
    .toggle-text { font-size: 0.9rem; font-weight: 600; color: var(--success); }

    .stats-panel { padding: 20px; text-align: center; }
    .chart-container { position: relative; height: 200px; margin-top: 10px; }

    /* Data Grid */
    .data-section { display: flex; flex-direction: column; gap: 20px; }
    
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px;
    }
    .result-count { font-family: 'JetBrains Mono', monospace; color: var(--brand); font-weight: 700; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
    }
    
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th {
      text-align: left;
      padding: 16px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      position: sticky; top: 0;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.03); }

    /* Special Column Styling */
    .col-code { font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 600; }
    .col-desc { font-weight: 500; color: white; }
    
    .stock-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .non-stock { color: var(--text-muted); font-style: italic; }

    /* Loader & Status */
    .status-bar {
      position: fixed; bottom: 20px; right: 20px;
      background: var(--bg-card);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 200;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
      .sidebar { order: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .data-section { order: 1; }
    }
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; align-items: flex-start; }
      .sidebar { grid-template-columns: 1fr; }
      .actions-top { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <header class="glass">
    <div class="brand-area" >
      <div class="logo-mark" >GISCO</div>
      <div class="titles">
        <h1>Oracle Materials</h1>
        <p>Intelligent Inventory Search</p>
      </div>
    </div>
    <div class="actions-top">
      <button class="btn" onclick="window.print()">🖨️ Print</button>
      <input type="file" id="localFile" accept=".csv" style="display:none" />
      <button class="btn primary" onclick="document.getElementById('localFile').click()">📂 Load CSV</button>
      <a href="index.html" class="btn">⬅ Home</a>
    </div>
  </header>

  <main>
    <!-- Left Sidebar: Controls & Stats -->
    <aside class=">sidebar">
      <div stye="item-align: center; padding: 10px 20px;">
      <p style="font-weight: bold;text-align: center;text-shadow: 1px 1px 4px rgba(252, 195, 7, 0.5);box-shadow: #00ffaa 1px 1px 1px; border-radius: 20px 20px 20px 20px;background-color:#0f172a;padding: 10px 20px;margin-bottom: 10px;">:::تصميم و برمجة: مصطفي النجار :::</p>
        </div>
      <div class="glass search-panel">
        <div class="input-group">
          <label >Search Query 1</label>
          <input id="q1" class="modern-input" type="text"  placeholder="Code or Description..." />
        </div>
        <div class="input-group">
          <label>Search Query 2</label>
          <input id="q2" class="modern-input" type="text" placeholder="Filter further..." />
        </div>
        <div class="input-group">
          <label>Search Query 3</label>
          <input id="q3" class="modern-input" type="text" placeholder="Additional terms..." />
        </div>
        <!-- ADDED 4TH QUERY BOX HERE -->
        <div class="input-group">
          <label>Search Query 4</label>
          <input id="q4" class="modern-input" type="text" placeholder="Final filter..." />
        </div>
        
        <label class="toggle-container">
          <input type="checkbox" id="stockOnly">
          <span class="toggle-text">Show Stock Items Only</span>
        </label>
      </div>

      <div class="glass stats-panel">
        <h3 style="font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase;">Inventory Mix</h3>
        <div class="chart-container">
          <canvas id="inventoryChart"></canvas>
        </div>
        <div style="margin-top: 15px; font-size: 0.8rem; color: var(--text-muted);">
          Total Records: <span id="totalCount" style="color: white; font-weight: bold;">0</span>
        </div>
      </div>
    </aside>

    <!-- Right Section: Data Display -->
    <section class="data-section">
      <div class="glass toolbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="color:var(--text-muted)">Results:</span>
          <span id="resultCount" class="result-count">0</span>
        </div>
        <div id="loader" style="display:none; align-items:center; gap:8px; color:var(--brand);">
          <div class="spinner"></div> Processing...
        </div>
      </div>

      <div class="table-wrapper glass">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Oracle Code</th>
              <th>Description</th>
              <th>Type</th>
              <th>Unit</th>
              <th>Qty</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Rows injected here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="statusBar" class="status-bar">
    <div class="spinner"></div> Initializing System...
  </div>

  <script>
    // --- Configuration & State ---
    const csvPath = 'Oracle.csv';
    let ALL_ROWS = [];
    let chartInstance = null;

    // --- Helpers ---
    function normalizeKey(k){ return String(k || '').toLowerCase().replace(/\s+|_/g,'').trim(); }
    
    function pickField(obj, aliases){
      const keys = Object.keys(obj);
      const normToKey = new Map(keys.map(k => [normalizeKey(k), k]));
      for (const alias of aliases){
        if (normToKey.has(normalizeKey(alias))) return obj[normToKey.get(normalizeKey(alias))];
      }
      return '';
    }

    function escapeHtml(s){
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    function setStatus(msg, isLoading = false) {
      const el = document.getElementById('statusBar');
      el.innerHTML = isLoading ? `<div class="spinner"></div> ${msg}` : msg;
      document.getElementById('loader').style.display = isLoading ? 'flex' : 'none';
    }

    // --- Data Processing ---
    const FIELD_ALIASES = {
      code: ['oracle code','code','item code','id'],
      description: ['item description','description','desc','name'],
      unit: ['unit','uom','measure'],
      qty: ['qty','quantity','onhand','stock'],
      type: ['type','category','class']
    };

    function buildRow(item){
      const code = String(pickField(item, FIELD_ALIASES.code) || '').trim();
      const description = String(pickField(item, FIELD_ALIASES.description) || '').trim();
      const unit = String(pickField(item, FIELD_ALIASES.unit) || '').trim();
      const qty = String(pickField(item, FIELD_ALIASES.qty) || '').trim();
      const type = String(pickField(item, FIELD_ALIASES.type) || '').trim();
      
      // Create a searchable string
      const searchIndex = `${code} ${description} ${type}`.toLowerCase();
      const isStock = type.toLowerCase().includes('stock');

      return { code, description, unit, qty, type, searchIndex, isStock };
    }

    function parseCSV(csvText) {
      const lines = csvText.split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        
        // Simple CSV parser handling quotes
        const values = [];
        let current = '';
        let inQuotes = false;
        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          if (char === '"') inQuotes = !inQuotes;
          else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
          else current += char;
        }
        values.push(current.trim());
        
        const rowObj = {};
        headers.forEach((h, idx) => rowObj[h] = values[idx] || '');
        if (Object.keys(rowObj).length > 0) rows.push(buildRow(rowObj));
      }
      return rows;
    }

    // --- Rendering ---
    function renderTable(rows) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      // Performance optimization: Render only first 100 rows if no search active, otherwise all matches
      const limit = rows.length > 500 && document.getElementById('q1').value === '' ? 100 : rows.length;
      
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < limit; i++) {
        const r = rows[i];
        const tr = document.createElement('tr');
        
        const typeDisplay = r.isStock 
          ? `<span class="stock-badge">STOCK ITEM</span>` 
          : `<span class="non-stock">${escapeHtml(r.type)}</span>`;

        tr.innerHTML = `
          <td class="col-code">${escapeHtml(r.code)}</td>
          <td class="col-desc">${escapeHtml(r.description)}</td>
          <td>${typeDisplay}</td>
          <td style="font-family:'JetBrains Mono'">${escapeHtml(r.unit)}</td>
          <td style="font-family:'JetBrains Mono'; color: ${Number(r.qty)>0?'var(--success)':'var(--text-muted)'}">${escapeHtml(r.qty)}</td>
        `;
        fragment.appendChild(tr);
      }
      tbody.appendChild(fragment);
      
      document.getElementById('resultCount').textContent = rows.length.toLocaleString();
      document.getElementById('totalCount').textContent = rows.length.toLocaleString();
      updateChart(rows);
    }

    function updateChart(rows) {
      const stockCount = rows.filter(r => r.isStock).length;
      const nonStockCount = rows.length - stockCount;

      const ctx = document.getElementById('inventoryChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Stock Items', 'Non-Stock'],
          datasets: [{
            data: [stockCount, nonStockCount],
            backgroundColor: ['#10b981', '#334155'],
            borderColor: '#0f172a',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Inter' } } }
          },
          cutout: '70%'
        }
      });
    }

    // --- Search Logic ---
    function filterNow() {
      const q1 = document.getElementById('q1').value.toLowerCase();
      const q2 = document.getElementById('q2').value.toLowerCase();
      const q3 = document.getElementById('q3').value.toLowerCase();
      const q4 = document.getElementById('q4').value.toLowerCase(); // Added Q4
      const stockOnly = document.getElementById('stockOnly').checked;

      const filtered = ALL_ROWS.filter(r => {
        if (stockOnly && !r.isStock) return false;
        
        const text = r.searchIndex;
        // AND logic for all 4 inputs
        if (q1 && !text.includes(q1)) return false;
        if (q2 && !text.includes(q2)) return false;
        if (q3 && !text.includes(q3)) return false;
        if (q4 && !text.includes(q4)) return false; // Added Q4 check
        
        return true;
      });

      renderTable(filtered);
    }

    // Debounce for performance
    let timeout;
    function debouncedFilter() {
      clearTimeout(timeout);
      timeout = setTimeout(filterNow, 150);
    }

    // --- Initialization ---
    async function loadData() {
      setStatus('Fetching Oracle Data...', true);
      try {
        // Try fetching from server
        const res = await fetch(csvPath);
        if (!res.ok) throw new Error('File not found');
        const text = await res.text();
        ALL_ROWS = parseCSV(text);
        setStatus(`Loaded ${ALL_ROWS.length} records successfully.`);
        renderTable(ALL_ROWS);
      } catch (e) {
        console.warn(e);
        setStatus('Local Mode: Please load Oracle.csv manually.', false);
        document.getElementById('resultCount').textContent = '0';
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      // Added q4 to the event listeners
      ['q1', 'q2', 'q3', 'q4'].forEach(id => {
        document.getElementById(id).addEventListener('input', debouncedFilter);
      });
      document.getElementById('stockOnly').addEventListener('change', filterNow);
      
      document.getElementById('localFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setStatus('Reading local file...', true);
        const reader = new FileReader();
        reader.onload = (evt) => {
          ALL_ROWS = parseCSV(evt.target.result);
          setStatus(`Loaded ${ALL_ROWS.length} records from local file.`);
          renderTable(ALL_ROWS);
        };
        reader.readAsText(file);
      });

      loadData();
    });
  </script>
</body>
</html>
