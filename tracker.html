<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vehicle Usage Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; padding: 16px; background: #f5f7fa; color: #333; transition: direction 0.3s; }
    .container {
      max-width: 100%; margin: auto; background: white; padding: 20px;
      border-radius: 10px; box-shadow: 0 2px 10, rgba(0,0,0,0.1);
    }
    h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 1.5rem; }
    .info-header {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
      background: #eef2f7; border-radius: 8px; margin-bottom: 20px; font-weight: bold;
      flex-wrap: wrap; gap: 10px;
    }
    .info-header div { flex: 1; text-align: center; min-width: 120px; }
    .month-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .month-selector label { font-weight: bold; }
    .month-selector select, .month-selector button { 
      padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px;
    }

    .log-table {
      width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid #ddd; font-size: 0.85rem;
    }
    .log-table th, .log-table td {
      padding: 6px; text-align: left; border: 1px solid #ddd;
    }
    .log-table th {
      background-color: #f2f2f2; font-weight: bold;
    }
    .log-table tr:nth-child(even) { background-color: #fafafa; }

    button {
      background: #3498db; color: white; border: none; padding: 10px 15px; margin-top: 10px; border-radius: 6px; cursor: pointer; font-size: 14px;
      flex: 1; min-width: 100px;
    }
    button:hover { background: #2980b9; }
    #langToggle { background: #9b59b6; margin-top: 0; }
    #langToggle:hover { background: #8e44ad; }
    #status { margin-top: 10px; text-align: center; font-style: italic; color: #7f8c8d; }

    .modal { 
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6); overflow: auto;
    }
    .modal-content { 
      background-color: white; margin: 5% auto; padding: 15px; border-radius: 10px;
      width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-sizing: border-box;
    }
    .close { float: right; font-size: 24px; font-weight: bold; cursor: pointer; color: #e74c3c; }
    .modal-title { margin-top: 0; text-align: center; }

    #entryForm { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    #entryForm label { font-weight: bold; margin-top: 5px; display: block; }
    #entryForm input, #entryForm textarea, #entryForm select { 
      padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; font-size: 16px;
    }
    #entryForm button {
      width: 100%; padding: 12px; margin-top: 5px;
    }

    small { color: #777; font-size: 0.85em; }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 12px; }
      h1 { font-size: 1.3rem; margin-bottom: 15px; }
      .info-header { flex-direction: column; align-items: stretch; padding: 10px; gap: 8px; }
      .month-selector { flex-direction: column; align-items: stretch; gap: 10px; }
      .month-selector label { align-self: flex-start; }
      .log-table { font-size: 0.75rem; min-width: 600px; overflow-x: auto; display: block; }
      .modal-content { width: 95%; margin: 10px auto; padding: 12px; }
      button { padding: 12px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="appTitle">Vehicle Usage Tracker</h1>

    <div class="info-header">
      <div><span id="lblVehicle">VEHICLE NO</span></div>
      <div><span id="lblDriver">DRIVER NAME</span></div>
    </div>

    <div class="month-selector">
      <label id="lblSelectMonth">View Month:</label>
      <select id="monthSelect">
        <option value="">Select Month...</option>
      </select>
      <button id="addEntryBtn">Start Trip</button>
      <button id="langToggle">العربية / English</button>
    </div>

    <div id="status"></div>

    <table class="log-table" id="logTable">
      <thead>
        <tr>
          <th id="thSN">SN</th>
          <th id="thLocation">LOCATION</th>
          <th id="thDate">DATE</th>
          <th id="thStartTime">START TIME</th>
          <th id="thStartKm">START (KM)</th>
          <th id="thEndKm">END (KM)</th>
          <th id="thEndTime">END TIME</th>
          <th id="thUsage">USAGE (KM)</th>
          <th id="thDuration">DURATION</th>
          <th id="thRemarks">REMARKS</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>

    <div id="entryModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3 id="modalTitle">Add New Entry</h3>
        <form id="entryForm">
          <label id="lblDate">Date:</label>
          <input type="date" id="dateInput" required />

          <label id="lblLocation">Location:</label>
          <input type="text" id="locationInput" list="locationList" placeholder="Start typing or select..." />
          <datalist id="locationList"></datalist>

          <div id="startGroup">
            <label id="lblStartKm">Start (KM):</label>
            <input type="number" id="startKmInput" min="0" step="1" required />
            <label id="lblStartTime">Start Time:</label>
            <input type="time" id="startTimeInput" required />
          </div>

          <div id="endGroup" style="display:none;">
            <label id="lblEndKm">End (KM):</label>
            <input type="number" id="endKmInput" min="0" step="1" required />
            <label id="lblEndTime">End Time:</label>
            <input type="time" id="endTimeInput" required />
          </div>

          <label id="lblRemarks">Remarks:</label>
          <textarea id="remarksInput" rows="3" placeholder="Any additional notes..."></textarea>

          <button type="submit" id="btnSave">Start Trip</button>
          <button type="button" id="cancelBtn" style="background:#95a5a6;">Cancel</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // ==============================
    // 🔑 DRIVER CONFIGURATION
    // ==============================
    const DRIVERS = {
      1234: { name: "Mohammad Akbar Mohammad Wasi", vehicleNo: "43572" },
      5678: { name: "Muhammad Asnaf Muhammad Siddique", vehicleNo: "43571" },
      91011: { name: "Gurlal Singh Desa Singh", vehicleNo: "68034" },
      1213: { name: "Muhammad Ashfaq Hameed Ahmed", vehicleNo: "68054" },
      1415: { name: "RAJASEAKARAN", vehicleNo: "68046" },
      1617: { name: "Atif Ullah Tahir Shah", vehicleNo: "68047" },
      1819: { name: "KUMAR MuTHASAMY", vehicleNo: "68042" },
      2021: { name: "Mohammed Safullah", vehicleNo: "68045" }
    };

    // ==============================
    // 🔤 TRANSLATIONS
    // ==============================
    const translations = {
      en: {
        appTitle: "Vehicle Usage Tracker",
        lblSelectMonth: "View Month:",
        startTripBtn: "Start Trip",
        endTripBtn: "End Trip",
        langToggle: "العربية / English",
        thSN: "SN",
        thLocation: "LOCATION",
        thDate: "DATE",
        thStartKm: "START (KM)",
        thStartTime: "START TIME",
        thEndKm: "END (KM)",
        thUsage: "USAGE (KM)",
        thEndTime: "END TIME",
        thDuration: "DURATION",
        thRemarks: "REMARKS",
        modalTitle: "Add New Entry",
        lblDate: "Date:",
        lblLocation: "Location:",
        lblStartKm: "Start (KM):",
        lblStartTime: "Start Time:",
        lblEndKm: "End (KM):",
        lblEndTime: "End Time:",
        lblRemarks: "Remarks:",
        btnSave: "Save",
        btnCancel: "Cancel",
        statusSuccess: "✓ Successfully saved",
        statusLoadError: "⚠ Failed to load records",
        statusDbError: "⚠ Database connection error",
        alertLessKm: "❌ End KM must be greater than Start KM!",
        alertFutureDate: "❌ Cannot enter a future date!",
        alertSaveFail: "❌ Save failed. Check connection and try again.",
        alertNonInteger: "KM values must be whole numbers (integers).",
        noDataCurrent: "No data for this month.",
        selectMonth: "Select Month...",
        modalTitleClose: "Close Previous Trip",
        locationPlaceholder: "Start typing or select...",
        alertEndRequired: "End KM and End Time are required to close the trip.",
        alertOpenTripExists: "You already have an open trip! Please end it first."
      },
      ar: {
        appTitle: "متابعة استخدام سيارة المشروع",
        lblSelectMonth: "عرض الشهر:",
        startTripBtn: "بدء الرحلة",
        endTripBtn: "إنهاء الرحلة",
        langToggle: "English / العربية",
        thSN: "ر.ت",
        thLocation: "الموقع",
        thDate: "التاريخ",
        thStartKm: "بداية (كم)",
        thStartTime: "وقت البدء",
        thEndKm: "نهاية (كم)",
        thUsage: "الاستخدام (كم)",
        thEndTime: "وقت النهاية",
        thDuration: "المدة",
        thRemarks: "ملاحظات",
        modalTitle: "إدخال جديد",
        lblDate: "التاريخ:",
        lblLocation: "الموقع:",
        lblStartKm: "قراءة بداية الخدمة (كم):",
        lblStartTime: "وقت البدء:",
        lblEndKm: "قراءة نهاية الخدمة (كم):",
        lblEndTime: "وقت النهاية:",
        lblRemarks: "ملاحظات:",
        btnSave: "حفظ",
        btnCancel: "إلغاء",
        statusSuccess: "✓ تم الحفظ بنجاح",
        statusLoadError: "⚠ فشل تحميل السجلات",
        statusDbError: "⚠ خطأ في الاتصال بقاعدة البيانات",
        alertLessKm: "❌ يجب أن تكون قراءة النهاية أكبر من القراءة الابتدائية!",
        alertFutureDate: "❌ لا يمكن إدخال تاريخ مستقبلي!",
        alertSaveFail: "❌ فشل الحفظ. تحقق من الاتصال وحاول لاحقًا.",
        alertNonInteger: "يجب أن تكون قيم الكيلومترات أرقامًا صحيحة (بدون فواصل عشرية).",
        noDataCurrent: "لا توجد بيانات لهذا الشهر.",
        selectMonth: "اختر شهرًا...",
        modalTitleClose: "إغلاق الرحلة السابقة",
        locationPlaceholder: "ابدأ الكتابة أو اختر...",
        alertEndRequired: "قراءة النهاية ووقت النهاية مطلوبان لإغلاق الرحلة.",
        alertOpenTripExists: "لديك رحلة مفتوحة بالفعل! يرجى إنهاؤها أولاً."
      }
    };

    // ==============================
    // 🌍 LANGUAGE SETUP
    // ==============================
    let currentLang = localStorage.getItem('userLang') || 'en';
    const dirMap = { en: 'ltr', ar: 'rtl' };
    const localeMap = { en: 'en-US', ar: 'ar-SA' };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('userLang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = dirMap[lang];
      applyTranslations();
    }

    function applyTranslations() {
      const t = translations[currentLang];
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('lblSelectMonth').textContent = t.lblSelectMonth;
      document.getElementById('langToggle').textContent = t.langToggle;
      document.getElementById('thSN').textContent = t.thSN;
      document.getElementById('thLocation').textContent = t.thLocation;
      document.getElementById('thDate').textContent = t.thDate;
      document.getElementById('thStartKm').textContent = t.thStartKm;
      document.getElementById('thStartTime').textContent = t.thStartTime;
      document.getElementById('thEndKm').textContent = t.thEndKm;
      document.getElementById('thUsage').textContent = t.thUsage;
      document.getElementById('thEndTime').textContent = t.thEndTime;
      document.getElementById('thDuration').textContent = t.thDuration;
      document.getElementById('thRemarks').textContent = t.thRemarks;
      document.getElementById('modalTitle').textContent = t.modalTitle;
      document.getElementById('lblDate').textContent = t.lblDate;
      document.getElementById('lblLocation').textContent = t.lblLocation;
      document.getElementById('lblStartKm').textContent = t.lblStartKm;
      document.getElementById('lblStartTime').textContent = t.lblStartTime;
      document.getElementById('lblEndKm').textContent = t.lblEndKm;
      document.getElementById('lblEndTime').textContent = t.lblEndTime;
      document.getElementById('lblRemarks').textContent = t.lblRemarks;
      document.getElementById('cancelBtn').textContent = t.btnCancel;
      document.getElementById('locationInput').placeholder = t.locationPlaceholder;
      document.getElementById('monthSelect').children[0].textContent = t.selectMonth;
      updateTripButtons();
    }

    // ==============================
    // 🔌 SUPABASE SETUP
    // ==============================
    const SUPABASE_URL = 'https://gecghwcqgxmitcsjbnst.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlY2dod2NxZ3htaXRjc2pibnN0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2NDg2Njc5MCwiZXhwIjoyMDgwNDQyNzkwfQ.XivlPCcELbiLHljLZFBZoJSBp2HQDz2mhZzzxP0F4ow';
    const supabase = supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim());

    // ==============================
    // 📅 GLOBAL STATE
    // ==============================
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const PROJECT_NUMBER = "3478M";
    const INITIAL_LOCATIONS = [
      "Seh Albanah", "Fujirah", "Thoban", "Manama", "Manama Training",
      "Al-Hail", "Fujairah airport", "Dubai", "Abu Dhabi", "Azan", "Dubai Airport"
    ];

    let driverConfig = null;
    let vehicleId = null;
    let entries = [];
    let currentOpenTrip = null;
    let realtimeSubscription = null;

    // ==============================
    // ✅ HELPER FUNCTIONS
    // ==============================
    const isValidValue = (val) => val != null && val !== '' && val !== undefined;

    const isOpenTrip = (entry) => {
      const hasStart = isValidValue(entry.start_km) && isValidValue(entry.start_time);
      const hasEnd = isValidValue(entry.end_km) && isValidValue(entry.end_time);
      return hasStart && !hasEnd;
    };

    const getEntryTimestamp = (entry) => {
      const timePart = (isValidValue(entry.end_km) && isValidValue(entry.end_time)) ? entry.end_time : entry.start_time;
      return new Date(entry.entry_date + 'T' + timePart);
    };

    const getLastClosedTrip = () => {
      const closed = entries.filter(e => isValidValue(e.end_km) && isValidValue(e.end_time));
      return closed.length ? closed.reduce((a, b) => getEntryTimestamp(a) > getEntryTimestamp(b) ? a : b) : null;
    };

    const calculateDuration = (startTime, endTime, date) => {
      if (!startTime || !endTime) return '–';
      const start = new Date(`${date}T${startTime}`);
      let end = new Date(`${date}T${endTime}`);
      if (end < start) end.setDate(end.getDate() + 1);
      const diffMs = end - start;
      const h = Math.floor(diffMs / 3600000);
      const m = Math.floor((diffMs % 3600000) / 60000);
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    };

    const updateTripButtons = () => {
      const t = translations[currentLang];
      const hasOpen = entries.some(isOpenTrip);
      const addBtn = document.getElementById('addEntryBtn');
      const saveBtn = document.getElementById('btnSave');
      if (hasOpen) {
        addBtn.textContent = t.endTripBtn;
        if (saveBtn) saveBtn.textContent = t.endTripBtn;
      } else {
        addBtn.textContent = t.startTripBtn;
        if (saveBtn) saveBtn.textContent = t.startTripBtn;
      }
    };

    const closeEntryModal = () => {
      document.getElementById('entryModal').style.display = 'none';
      document.getElementById('status').textContent = '';
    };

    const updateLocationDatalist = () => {
      const datalist = document.getElementById('locationList');
      if (!datalist) return;
      const entryLocs = [...new Set(entries.map(e => e.location).filter(isValidValue))];
      const allLocs = [...new Set([...INITIAL_LOCATIONS, ...entryLocs])];
      datalist.innerHTML = '';
      allLocs.forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc;
        datalist.appendChild(opt);
      });
    };

    // ==============================
    // 💾 OFFLINE SUPPORT
    // ==============================
    let OFFLINE_KEY = '';

    const saveOffline = (entry) => {
      if (!OFFLINE_KEY) return;
      let offline = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
      offline.push(entry);
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(offline));
    };

    const processOfflineQueue = async () => {
      if (!vehicleId || !OFFLINE_KEY) return;
      const offline = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
      if (!offline.length) return;

      for (const entry of offline) {
        try {
          if (entry.type === 'start') {
            const { error } = await supabase
              .from('meter_entries')
              .insert([{
                vehicle_id: vehicleId,
                entry_date: entry.date,
                location: entry.location || null,
                start_km: entry.startKm,
                start_time: entry.startTime,
                remarks: entry.remarks || null,
                created_at: new Date().toISOString()
              }]);
            if (error) throw error;
          } else if (entry.type === 'end') {
            const { error } = await supabase
              .from('meter_entries')
              .update({
                end_km: entry.endKm,
                end_time: entry.endTime,
                location: entry.location || null,
                updated_at: new Date().toISOString()
              })
              .eq('id', entry.id);
            if (error) throw error;
          }
        } catch (err) {
          console.warn('Offline sync failed, keeping in queue:', entry);
          return;
        }
      }
      localStorage.removeItem(OFFLINE_KEY);
      await loadEntries();
    };

    // ==============================
    // 🔁 REALTIME
    // ==============================
    const setupRealtime = () => {
      if (realtimeSubscription) realtimeSubscription.unsubscribe();
      if (!vehicleId) return;

      realtimeSubscription = supabase
        .channel(`vehicle_${vehicleId}`)
        .on('postgres_changes', {
          event: '*',
          schema: 'public',
          table: 'meter_entries',
          filter: `vehicle_id=eq.${vehicleId}`
        }, () => loadEntries())
        .subscribe();
    };

    // ==============================
    // 🚀 DATA LOADING
    // ==============================
    const loadEntries = async () => {
      if (!vehicleId) return;
      try {
        const { data, error } = await supabase
          .from('meter_entries')
          .select('*')
          .eq('vehicle_id', vehicleId)
          .order('entry_date', { ascending: true })
          .order('start_time', { ascending: true });

        if (error) throw error;
        entries = data || [];
        currentOpenTrip = entries.find(isOpenTrip) || null;
        populateMonths();
        displayCurrentMonthData();
        updateLocationDatalist();
        updateTripButtons();
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('status').textContent = translations[currentLang].statusLoadError;
      }
    };

    const displayCurrentMonthData = () => {
      const container = document.getElementById('logBody');
      const t = translations[currentLang];
      const month = document.getElementById('monthSelect').value;
      const filtered = month ? entries.filter(e => e.entry_date.startsWith(month)) : entries;

      if (!filtered.length) {
        container.innerHTML = `<tr><td colspan="10" style="text-align:center;">${t.noDataCurrent}</td></tr>`;
        return;
      }

      filtered.sort((a, b) => getEntryTimestamp(a) - getEntryTimestamp(b));
      container.innerHTML = filtered.map((e, i) => {
        const dateStr = new Date(e.entry_date).toLocaleDateString(localeMap[currentLang]);
        const usage = isValidValue(e.end_km) && isValidValue(e.start_km)
          ? (parseInt(e.end_km) - parseInt(e.start_km)).toString()
          : '–';
        const duration = calculateDuration(e.start_time, e.end_time, e.entry_date);
        return `
          <tr>
            <td>${i + 1}</td>
            <td>${e.location || ''}</td>
            <td>${dateStr}</td>
            <td>${e.start_time}</td>
            <td>${e.start_km || ''} ${e.start_km ? '<small>(KM)</small>' : ''}</td>
            <td>${e.end_km || ''} ${e.end_km ? '<small>(KM)</small>' : ''}</td>
            <td>${e.end_time || ''}</td>
            <td>${usage}</td>
            <td>${duration}</td>
            <td>${e.remarks || ''}</td>
          </tr>
        `;
      }).join('');
    };

    const populateMonths = () => {
      const select = document.getElementById('monthSelect');
      select.innerHTML = `<option value="">${translations[currentLang].selectMonth}</option>`;
      const months = [...new Set(entries.map(e => e.entry_date.substring(0, 7)))].sort().reverse();
      months.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = new Date(m + '-01').toLocaleDateString(localeMap[currentLang], { month: 'long', year: 'numeric' });
        select.appendChild(opt);
      });
    };

    // ==============================
    // 🎯 MODAL & SAVE
    // ==============================
    const openEntryModal = () => {
      const now = new Date();
      const timeStr = now.toTimeString().slice(0, 5);
      document.getElementById('entryForm').reset();
      document.getElementById('dateInput').value = todayStr;

      const t = translations[currentLang];
      const startGroup = document.getElementById('startGroup');
      const endGroup = document.getElementById('endGroup');
      const modalTitle = document.getElementById('modalTitle');
      const saveBtn = document.getElementById('btnSave');

      if (currentOpenTrip) {
        modalTitle.textContent = t.modalTitleClose;
        startGroup.style.display = 'none';
        endGroup.style.display = 'block';
        saveBtn.textContent = t.endTripBtn;
        document.getElementById('locationInput').value = currentOpenTrip.location || '';
        document.getElementById('endTimeInput').value = timeStr;
      } else {
        modalTitle.textContent = t.modalTitle;
        startGroup.style.display = 'block';
        endGroup.style.display = 'none';
        saveBtn.textContent = t.startTripBtn;
        document.getElementById('startTimeInput').value = timeStr;

        const lastClosed = getLastClosedTrip();
        if (lastClosed) {
          document.getElementById('startKmInput').value = lastClosed.end_km;
          document.getElementById('locationInput').value = lastClosed.location || '';
        } else {
          document.getElementById('startKmInput').value = 0;
        }
      }
      document.getElementById('entryModal').style.display = 'block';
    };

    const isInteger = (val) => {
      const num = parseFloat(val);
      return !isNaN(num) && Number.isInteger(num);
    };

    const saveEntry = async (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      if (!vehicleId) return;

      try {
        if (currentOpenTrip) {
          const endKm = document.getElementById('endKmInput').value.trim();
          const endTime = document.getElementById('endTimeInput').value.trim();
          const location = document.getElementById('locationInput').value.trim();

          if (!endKm || !endTime) return alert(t.alertEndRequired);
          if (!isInteger(endKm)) return alert(t.alertNonInteger);

          const endKmNum = parseInt(endKm, 10);
          if (endKmNum <= parseInt(currentOpenTrip.start_km, 10)) return alert(t.alertLessKm);

          const { error } = await supabase
            .from('meter_entries')
            .update({
              end_km: endKmNum,
              end_time: endTime,
              location: location || null,
              updated_at: new Date().toISOString()
            })
            .eq('id', currentOpenTrip.id);

          if (error) throw error;
          currentOpenTrip.end_km = endKmNum;
          currentOpenTrip.end_time = endTime;
          currentOpenTrip.location = location || currentOpenTrip.location;
          currentOpenTrip = null;
        } else {
          const date = document.getElementById('dateInput').value;
          const location = document.getElementById('locationInput').value.trim();
          const startKm = document.getElementById('startKmInput').value;
          const startTime = document.getElementById('startTimeInput').value;
          const remarks = document.getElementById('remarksInput').value.trim();

          if (new Date(date) > today) return alert(t.alertFutureDate);
          if (!isInteger(startKm)) return alert(t.alertNonInteger);

          const startKmNum = parseInt(startKm, 10);
          const lastClosed = getLastClosedTrip();
          if (lastClosed && startKmNum < parseInt(lastClosed.end_km, 10)) return alert(t.alertLessKm);
          if (entries.some(isOpenTrip)) return alert(t.alertOpenTripExists);

          const { data, error } = await supabase
            .from('meter_entries')
            .insert([{
              vehicle_id: vehicleId,
              entry_date: date,
              location: location || null,
              start_km: startKmNum,
              start_time: startTime,
              remarks: remarks || null,
              created_at: new Date().toISOString()
            }])
            .select()
            .single();

          if (error) throw error;
          entries.push(data);
          currentOpenTrip = data;
        }

        document.getElementById('status').textContent = t.statusSuccess;
        closeEntryModal();
        displayCurrentMonthData();
        updateTripButtons();
        setTimeout(() => document.getElementById('status').textContent = '', 3000);
      } catch (err) {
        console.error('Save error:', err);
        if (currentOpenTrip) {
          saveOffline({
            type: 'end',
            id: currentOpenTrip.id,
            endKm: document.getElementById('endKmInput').value.trim(),
            endTime: document.getElementById('endTimeInput').value.trim(),
            location: document.getElementById('locationInput').value.trim()
          });
        } else {
          saveOffline({
            type: 'start',
            date: document.getElementById('dateInput').value,
            location: document.getElementById('locationInput').value.trim(),
            startKm: document.getElementById('startKmInput').value,
            startTime: document.getElementById('startTimeInput').value,
            remarks: document.getElementById('remarksInput').value.trim()
          });
        }
        alert(t.alertSaveFail + " Saved offline.");
      }
    };

    // ==============================
    // 🔐 INIT VEHICLE & DRIVER
    // ==============================
    const initializeApp = async () => {
      // Parse driver ID safely
      const urlParams = new URLSearchParams(window.location.search);
      const driverIdParam = urlParams.get('driver');
      const validIds = Object.keys(DRIVERS).map(Number);
      let driverId = 1213; // default

      if (driverIdParam) {
        const parsed = parseInt(driverIdParam, 10);
        if (!isNaN(parsed) && DRIVERS[parsed]) driverId = parsed;
      }

      driverConfig = DRIVERS[driverId];
      OFFLINE_KEY = `offline_entries_${driverConfig.vehicleNo}`;

      // Update UI immediately (even before DB)
      document.getElementById('lblVehicle').textContent = `VEHICLE NO (${driverConfig.vehicleNo})`;
      document.getElementById('lblDriver').textContent = `DRIVER NAME : ${driverConfig.name}`;

      // Initialize vehicle in DB
      try {
        let { data, error } = await supabase
          .from('vehicles')
          .select('id')
          .eq('vehicle_number', driverConfig.vehicleNo)
          .single();

        if (error?.code === 'PGRST116') {
          const { data: newV, error: insErr } = await supabase
            .from('vehicles')
            .insert({
              project_number: PROJECT_NUMBER,
              vehicle_number: driverConfig.vehicleNo,
              driver_name: driverConfig.name
            })
            .select('id')
            .single();
          if (insErr) throw insErr;
          vehicleId = newV.id;
        } else if (error) {
          throw error;
        } else {
          vehicleId = data.id;
        }

        await loadEntries();
        setupRealtime();
        await processOfflineQueue();
      } catch (err) {
        console.error('Init error:', err);
        document.getElementById('status').textContent = translations[currentLang].statusDbError;
      }
    };

    // ==============================
    // 🎮 EVENT LISTENERS
    // ==============================
    document.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
      initializeApp();

      document.getElementById('langToggle').addEventListener('click', () =>
        setLanguage(currentLang === 'en' ? 'ar' : 'en')
      );

      document.getElementById('addEntryBtn').addEventListener('click', openEntryModal);
      document.getElementById('entryForm').addEventListener('submit', saveEntry);
      document.getElementById('cancelBtn').addEventListener('click', closeEntryModal);

      document.querySelectorAll('.close').forEach(btn =>
        btn.addEventListener('click', () => btn.closest('.modal').style.display = 'none')
      );

      document.querySelectorAll('.modal').forEach(modal =>
        modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; })
      );

      document.getElementById('monthSelect').addEventListener('change', displayCurrentMonthData);

      // Enforce integer input
      ['startKmInput', 'endKmInput'].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('input', () => {
          let val = input.value;
          if (val === '') return;
          const num = parseFloat(val);
          if (!isNaN(num) && !Number.isInteger(num)) input.value = Math.floor(num).toString();
        });
      });
    });
  </script>
</body>
</html>
