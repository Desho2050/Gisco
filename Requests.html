<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requests – Search and Filters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --brand: #1e4672;
      --accent: #7f3fbf;
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #172b4d;
      --muted: #6b778c;
      --border: #dde5ef;
      --row-alt: #f8fafc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .topbar { background: linear-gradient(135deg, var(--brand), var(--accent)); color: #fff; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { height: 40px; width: auto; object-fit: contain; }
    .title { font-weight: 700; letter-spacing: 0.3px; }
    .label { color: var(--muted); font-size: 12px; }
    .topbar .dashboard-label { color: rgba(255,255,255,0.95); font-size: 14px; font-weight: 600; }

    .container { max-width: 1200px; margin: 18px auto; padding: 0 16px; }

    /* Back button style */
    .back-link {
      background: #2563eb;
      color: #fff;
      border: 1px solid #1d4ed8;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: auto !important;
      width: fit-content;
      padding: 0 16px !important;
      height: 36px;
      white-space: nowrap;
    }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .search-box { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .search-box input { 
      height: 36px; 
      padding: 0 12px; 
      flex: 1 1 220px; 
      min-width: 160px; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      outline: none; 
      color: var(--text); 
    }
    .search-box input::placeholder { color: var(--muted); opacity: 1; }
    .search-box input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(30,70,114,0.12); }

    .btn { 
      height: 36px; 
      padding: 0 14px; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      background: #fff; 
      color: var(--text); 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      cursor: pointer; 
      text-decoration: none; 
      white-space: nowrap; 
      min-width: 160px; 
      justify-content: center; 
    }
    .btn.primary { background: var(--brand); color: #fff; border-color: #183a5e; }
    .btn.blue { background: #4f46e5; color: #fff; border-color: #3730a3; }
    .btn.purple { background: #7c3aed; color: #fff; border-color: #5b21b6; }
    .btn.green { background: #22c55e; color: #fff; border-color: #16a34a; }
    .btn.orange { background: #f59e0b; color: #fff; border-color: #d97706; }
    .btn.pink { background: #ec4899; color: #fff; border-color: #db2777; }

    /* Small language buttons */
    .btn.small {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
      min-width: auto;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      backdrop-filter: blur(4px);
      cursor: pointer;
    }
    .btn.small:hover {
      background: rgba(255,255,255,0.3);
    }

    .summary { display: flex; gap: 12px; align-items: center; }
    .sum-box { 
      background: #fff; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 10px 14px; 
      font-size: 20px; 
      font-weight: 700; 
      color: var(--text); 
    }
    .summary .label { 
      color: var(--text); 
      font-size: 16px; 
      font-weight: 700; 
    }
    .counter { font-size: 16px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

    .table-wrap { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      margin-top: 12px; 
      overflow: hidden; 
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch; 
    }
    table { 
      width: 100%; 
      min-width: 900px; 
      border-collapse: collapse; 
    }
    thead th { 
      background: var(--brand); 
      color: #fff; 
      position: sticky; 
      top: 0; 
      z-index: 1; 
      padding: 10px; 
      font-size: 13px; 
      text-align: left; 
    }
    tbody td { 
      border-top: 1px solid var(--border); 
      padding: 9px; 
      font-size: 13px; 
      vertical-align: top; 
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    .right { text-align: right; }

    .loader { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(255,255,255,0.6); 
      align-items: center; 
      justify-content: center; 
      z-index: 999; 
    }
    .spinner { 
      width: 24px; 
      height: 24px; 
      border: 3px solid #d1d5db; 
      border-top-color: var(--brand); 
      border-radius: 50%; 
      animation: spin 0.9s linear infinite; 
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 900px) {
      .topbar { grid-template-columns: 1fr auto; }
    }
    @media (max-width: 640px) {
      .topbar { grid-template-columns: 1fr; row-gap: 8px; }
      .summary { flex-wrap: wrap; }
      .search-box input { min-width: 100%; }
      .actions { flex-direction: column; align-items: stretch; gap: 8px; }
      .btn, .back-link { width: 100%; min-width: 0; }
      .lang-switch { flex-direction: column; gap: 6px; width: 100%; }
      .lang-switch .btn.small { width: 100%; }
    }
  </style>
  <script>
    const I18N = {
      en: {
        brand_title: 'Gulf Industrial Service Company',
        dashboard_label: 'Requests Dashboard',
        back_main: '⬅ Back to Main Page',
        results_label: 'results',
        total_cost: 'Total Cost',
        show_all: 'Show All',
        filter_store: 'Store Materials Only',
        filter_po: 'Purchase Orders Only',
        filter_received: 'Received Materials Only',
        filter_wo: 'Work Order Costs',
        filter_m: 'Material Costs (No WO)',
        load_excel: 'Load Excel',
        req_no: 'Request No.',
        req_date: 'Request Date',
        order_no: 'Order No.',
        amount: 'Amount',
        receipt_date: 'Receipt Date',
        receipt_order: 'Receipt Order',
        details: 'Details',
        lang_ar: 'العربية',
        lang_en: 'English'
      },
      ar: {
        brand_title: 'شركة الخليج للخدمات الصناعية',
        dashboard_label: 'لوحة طلبات المواد',
        back_main: '⬅ العودة إلى الصفحة الرئيسية',
        results_label: 'نتائج',
        total_cost: 'إجمالي التكلفة',
        show_all: 'عرض الكل',
        filter_store: 'مواد المخزن فقط',
        filter_po: 'أوامر الشراء فقط',
        filter_received: 'المواد المستلمة فقط',
        filter_wo: 'تكلفة أوامر العمل',
        filter_m: 'تكلفة المواد بدون أوامر العمل',
        load_excel: 'تحميل ملف Excel',
        req_no: 'رقم الطلب',
        req_date: 'تاريخ الطلب',
        order_no: 'رقم الأمر',
        amount: 'المبلغ',
        receipt_date: 'تاريخ الاستلام',
        receipt_order: 'رقم امر الاستلام',
        details: 'تفاصيل',
        lang_ar: 'العربية',
        lang_en: 'English'
      }
    };

    const getLang = () => localStorage.getItem('selectedLanguage') || 'ar';

    const applyLang = (lang) => {
      document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      document.documentElement.lang = lang === 'ar' ? 'ar' : 'en';

      const dict = I18N[lang] || I18N.ar;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });

      const resultLabel = document.getElementById('resultCountLabel');
      const totalLabel = document.querySelector('.summary .label');
      if (resultLabel) resultLabel.textContent = dict.results_label;
      if (totalLabel) totalLabel.textContent = dict.total_cost;

      document.title = dict.dashboard_label + ' – ' + dict.brand_title;
    };

    const setLang = (lang) => {
      localStorage.setItem('selectedLanguage', lang);
      applyLang(lang);
    };

    const excelPath = 'Requests.xlsx';
    let ALL_ROWS = [];

    function formatAED(n) {
      return new Intl.NumberFormat('en-AE', { style: 'currency', currency: 'AED' }).format(Number(n || 0));
    }

    function showLoader(v) {
      const el = document.getElementById('loader');
      if (el) el.style.display = v ? 'flex' : 'none';
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('statusBar');
      el.textContent = msg || '';
      el.style.color = isError ? '#b00020' : 'var(--muted)';
    }

    const FIELD_ALIASES = {
      request: ['Requisition','req','reqno','req_no','req id','reqid','رقمالطلب','رقم الطلب'],
      requestDate: ['creation_date'],
      order: ['order','orderno','order_no','po','po no','po_no','store order','storeorder','رقمالامر','رقم الامر'],
      amount: ['amount','total','cost','المبلغ','value'],
      receiptDate: ['RECEIPT DATE','rec date','receiptdate','تاريخ الاستلام','تاريخالاستلام'],
      receiptOrder: ['Receipt','receiptno','receipt no','رقم امر الاستلام','رقمامرالاستلام'],
      remark: ['remark','type','classification','ملاحظة','ملاحظه','rmk']
    };

    function normalizeKey(k) {
      return String(k || '').toLowerCase().replace(/\s+|_/g, '').trim();
    }

    function pickField(obj, aliases) {
      const keys = Object.keys(obj);
      const normToKey = new Map(keys.map(k => [normalizeKey(k), k]));
      for (const alias of aliases) {
        const nk = normalizeKey(alias);
        if (normToKey.has(nk)) return obj[normToKey.get(nk)];
      }
      return '';
    }

    function dateToExcelSerial(val) {
      if (val === null || val === undefined || val === '') return '';
      if (typeof val === 'number' && isFinite(val)) return String(Math.floor(val));
      if (Object.prototype.toString.call(val) === '[object Date]') {
        const y = val.getUTCFullYear();
        const m = val.getUTCMonth();
        const d = val.getUTCDate();
        const base = Date.UTC(1899, 11, 30);
        const utc = Date.UTC(y, m, d);
        return String(Math.floor((utc - base) / 86400000));
      }
      const s = String(val).trim();
      const n = Number(s);
      if (!Number.isNaN(n) && isFinite(n)) return String(Math.floor(n));
      const d1 = new Date(s);
      if (!Number.isNaN(d1.getTime())) {
        const base = Date.UTC(1899, 11, 30);
        const utc = Date.UTC(d1.getUTCFullYear(), d1.getUTCMonth(), d1.getUTCDate());
        return String(Math.floor((utc - base) / 86400000));
      }
      const parts = s.match(/\d+/g);
      if (parts && parts.length >= 3) {
        const [a,b,c] = parts.map(Number);
        const candDMY = new Date(Date.UTC(c, (a-1), b));
        const candMDY = new Date(Date.UTC(c, (b-1), a));
        const use = (a > 12 && !Number.isNaN(candDMY.getTime())) ? candDMY
                  : (!Number.isNaN(candMDY.getTime())) ? candMDY
                  : (!Number.isNaN(candDMY.getTime())) ? candDMY
                  : null;
        if (use) {
          const base = Date.UTC(1899, 11, 30);
          const utc = Date.UTC(use.getUTCFullYear(), use.getUTCMonth(), use.getUTCDate());
          return String(Math.floor((utc - base) / 86400000));
        }
      }
      const digits = s.replace(/\D/g, '');
      return digits || s;
    }

    function formatDate(val) {
      if (val === null || val === undefined || val === '') return '';
      if (typeof val === 'number' && isFinite(val)) {
        const base = Date.UTC(1899, 11, 30);
        const ms = Math.round(val) * 86400000;
        const d = new Date(base + ms);
        return !Number.isNaN(d.getTime()) ? d.toISOString().slice(0,10) : String(val);
      }
      if (Object.prototype.toString.call(val) === '[object Date]') {
        return val.toISOString().slice(0,10);
      }
      const s = String(val).trim();
      const d1 = new Date(s);
      return !Number.isNaN(d1.getTime()) ? d1.toISOString().slice(0,10) : s;
    }

    function formatDateDMY(val) {
      if (val === null || val === undefined || val === '') return '';
      const pad2 = (n) => String(n).padStart(2,'0');
      const toDMY = (d) => `${pad2(d.getUTCDate())}/${pad2(d.getUTCMonth()+1)}/${d.getUTCFullYear()}`;
      if (typeof val === 'number' && isFinite(val)) {
        const base = Date.UTC(1899, 11, 30);
        const d = new Date(base + Math.round(val) * 86400000);
        return !Number.isNaN(d.getTime()) ? toDMY(d) : String(val);
      }
      if (Object.prototype.toString.call(val) === '[object Date]') {
        return toDMY(val);
      }
      const s = String(val).trim();
      const d1 = new Date(s);
      if (!Number.isNaN(d1.getTime())) return toDMY(d1);
      const parts = s.match(/\d+/g);
      if (parts && parts.length >= 3) {
        const [a,b,c] = parts.map(Number);
        const candDMY = new Date(Date.UTC(c, (b-1), a));
        const candMDY = new Date(Date.UTC(c, (a-1), b));
        const use = (a > 12 && !Number.isNaN(candDMY.getTime())) ? candDMY
                  : (!Number.isNaN(candMDY.getTime())) ? candMDY
                  : (!Number.isNaN(candDMY.getTime())) ? candDMY
                  : null;
        if (use) return toDMY(use);
      }
      return s;
    }

    function buildRow(item) {
      const request = String(pickField(item, FIELD_ALIASES.request) || '').trim();
      const requestDate = pickField(item, FIELD_ALIASES.requestDate);
      const order = String(pickField(item, FIELD_ALIASES.order) || '').trim();
      const amountRaw = pickField(item, FIELD_ALIASES.amount);
      const amount = Number(amountRaw || 0);
      const receiptDate = pickField(item, FIELD_ALIASES.receiptDate);
      const receiptOrder = String(pickField(item, FIELD_ALIASES.receiptOrder) || '').trim();
      const remark = String(pickField(item, FIELD_ALIASES.remark) || '').trim();
      const searchIndex = [
        request,
        dateToExcelSerial(requestDate),
        formatDateDMY(requestDate),
        order,
        amount,
        formatDate(receiptDate),
        receiptOrder,
        remark
      ].map(s => String(s).toLowerCase()).join(' | ');
      return { request, requestDate, order, amount, receiptDate, receiptOrder, remark, searchIndex };
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderTable(rows) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      let sum = 0;
      for (const r of rows) {
        sum += Number(r.amount) || 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="right">${escapeHtml(r.request)}</td>
          <td>${escapeHtml(formatDateDMY(r.requestDate))}</td>
          <td class="right">${escapeHtml(r.order)}</td>
          <td class="right">${formatAED(r.amount)}</td>
          <td>${escapeHtml(formatDate(r.receiptDate))}</td>
          <td class="right">${escapeHtml(r.receiptOrder)}</td>
          <td><button class="btn blue" onclick="openDetails('${encodeURIComponent(r.request)}')">تفاصيل</button></td>
        `;
        tbody.appendChild(tr);
      }
      document.getElementById('resultCount').textContent = String(rows.length);
      document.getElementById('sumAmount').textContent = formatAED(sum);
    }

    function filterNow() {
      const queries = [
        (document.getElementById('q1') || { value:'' }).value.trim().toLowerCase(),
        (document.getElementById('q2') || { value:'' }).value.trim().toLowerCase(),
        (document.getElementById('q3') || { value:'' }).value.trim().toLowerCase(),
        (document.getElementById('q4') || { value:'' }).value.trim().toLowerCase()
      ].filter(Boolean);
      const filtered = ALL_ROWS.filter(r => {
        const idx = r.searchIndex || '';
        return queries.every(q => q.split(/\s+/).every(tok => idx.includes(tok)));
      });
      renderTable(filtered);
    }

    function openDetails(req) {
      const cleanReq = decodeURIComponent(req || '');
      const url = 'Details.html?req=' + encodeURIComponent(cleanReq);
      window.open(url, '_blank');
    }

    async function loadExcel() {
      try {
        showLoader(true);
        setStatus('Loading Requests.xlsx…');
        const res = await fetch(excelPath + '?ts=' + Date.now());
        if (!res.ok) throw new Error(`Fetch failed: ${res.status} ${res.statusText}`);
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        ALL_ROWS = json.map(buildRow);
        renderTable(ALL_ROWS);
        setStatus(`Loaded ${ALL_ROWS.length} rows from Requests.xlsx`);
      } catch (e) {
        console.error(e);
        setStatus('Auto-load failed. Make sure Requests.xlsx is available.', true);
      } finally {
        showLoader(false);
      }
    }

    function showAll() { renderTable(ALL_ROWS); }
    function isReceived(val) { 
      const s = String(val || '').trim().toLowerCase(); 
      return s !== '' && s !== 'not received'; 
    }
    function receivedOnly() { 
      return ALL_ROWS.filter(r => isReceived(r.receiptDate)); 
    }
    function filterStore() { 
      const base = receivedOnly(); 
      renderTable(base.filter(r => String(r.order || '').length === 6)); 
    }
    function filterPO() { 
      const base = receivedOnly(); 
      renderTable(base.filter(r => String(r.order || '').length === 12)); 
    }
    function filterReceived() { 
      renderTable(receivedOnly()); 
    }
    function filterWO() { 
      const base = receivedOnly(); 
      renderTable(base.filter(r => String(r.remark || '').trim().toLowerCase() === 'wo')); 
    }
    function filterM() { 
      const base = receivedOnly(); 
      renderTable(base.filter(r => String(r.remark || '').trim().toLowerCase() === 'm')); 
    }

    async function loadLocalFile(evt) {
      const input = evt.target;
      const file = input.files && input.files[0];
      if (!file) return;
      const name = String(file.name || '').toLowerCase();
      const ps = document.getElementById('pathSelector');
      if (ps) { ps.style.display = 'inline-flex'; ps.value = file.name; }
      if (name !== 'requests.xlsx') {
        setStatus('Please select the file named "Requests.xlsx" only.', true);
        input.value = '';
        return;
      }
      try {
        showLoader(true);
        setStatus('Loading local Requests.xlsx…');
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        ALL_ROWS = json.map(buildRow);
        renderTable(ALL_ROWS);
        setStatus(`Loaded ${ALL_ROWS.length} rows from local file`);
      } catch (e) {
        console.error(e);
        setStatus('Local load failed. Ensure the file is a valid .xlsx', true);
      } finally {
        showLoader(false);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLang(getLang());

      // Language switcher
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setLang(btn.dataset.lang);
        });
      });

      loadExcel();

      const lf = document.getElementById('localFile');
      if (lf) lf.addEventListener('change', loadLocalFile);

      for (const id of ['q1','q2','q3','q4']) {
        document.addEventListener('input', (e) => {
          if (e.target && e.target.id === id) filterNow();
        });
      }

      if (location.protocol === 'file:') {
        const btn = document.getElementById('btnLocal');
        const ps = document.getElementById('pathSelector');
        if (btn) btn.style.display = 'inline-flex';
        if (ps) ps.style.display = 'inline-flex';
        setStatus('Opened without server. Use "Load Excel" to select Requests.xlsx');
      }
    });
  </script>
</head>
<body>
  <div id="loader" class="loader"><div class="spinner"></div></div>
  <header class="topbar">
    <div class="brand">
      <img src="Logo.bmp" alt="GISCO" class="logo" />
      <div>
        <div class="title" data-i18n="brand_title">شركة الخليج للخدمات الصناعية</div>
        <div class="dashboard-label" data-i18n="dashboard_label">لوحة طلبات المواد</div>
      </div>
    </div>

    <div class="summary">
      <span class="label" data-i18n="total_cost">إجمالي التكلفة</span>
      <div class="sum-box" id="sumAmount">AED&nbsp;0.00</div>
    </div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="lang-switch">
        <button class="btn small lang-btn" data-lang="ar" data-i18n="lang_ar">العربية</button>
        <button class="btn small lang-btn" data-lang="en" data-i18n="lang_en">English</button>
      </div>
      <div class="counter">
        <span id="resultCount">0</span>
        <span id="resultCountLabel" data-i18n="results_label">نتائج</span>
      </div>
    </div>
  </header>

  <div class="container" style="margin-top: 10px;">
    <a class="back-link" href="index.html" data-i18n="back_main">⬅ العودة إلى الصفحة الرئيسية</a>
  </div>

  <main class="container">
    <div class="search-box">
      <input type="text" id="q1" placeholder="بحث 1" />
      <input type="text" id="q2" placeholder="بحث 2" />
      <input type="text" id="q3" placeholder="بحث 3" />
      <input type="text" id="q4" placeholder="بحث 4" />
    </div>
    <div class="actions" style="margin-bottom: 10px;">
      <button class="btn primary" onclick="showAll()" data-i18n="show_all">عرض الكل</button>
      <button class="btn blue" onclick="filterStore()" data-i18n="filter_store">مواد المخزن فقط</button>
      <button class="btn purple" onclick="filterPO()" data-i18n="filter_po">أوامر الشراء فقط</button>
      <button class="btn green" onclick="filterReceived()" data-i18n="filter_received">المواد المستلمة فقط</button>
      <button class="btn orange" onclick="filterWO()" data-i18n="filter_wo">تكلفة أوامر العمل</button>
      <button class="btn pink" onclick="filterM()" data-i18n="filter_m">تكلفة المواد بدون أوامر العمل</button>
      
      <input type="file" id="localFile" accept=".xlsx,.xls" style="display:none" />
      <button id="btnLocal" class="btn green" style="display:none" onclick="document.getElementById('localFile').click()" data-i18n="load_excel">تحميل ملف Excel</button>
      <input type="text" id="pathSelector" placeholder="تم اختيار الملف..." readonly style="height:36px;border:1px solid var(--border);border-radius:8px;padding:0 10px;min-width:220px;display:none" />
    </div>

    <section class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th class="right" data-i18n="req_no">رقم الطلب</th>
            <th data-i18n="req_date">تاريخ الطلب</th>
            <th class="right" data-i18n="order_no">رقم الأمر</th>
            <th class="right" data-i18n="amount">المبلغ</th>
            <th data-i18n="receipt_date">تاريخ الاستلام</th>
            <th class="right" data-i18n="receipt_order">رقم امر الاستلام</th>
            <th data-i18n="details">تفاصيل</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>

    <div id="statusBar" class="label" style="margin-top:10px"></div>
  </main>
</body>
</html>
